name: Publish Image

on:
  push:
    tags:
      - '*' # matches release.yml — fires on any tag push (e.g. v1.0.0)

permissions:
  contents: read
  packages: write   # required to push to ghcr.io
  id-token: write   # required for cosign keyless signing via GitHub OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_RUNTIME: ghcr.io/${{ github.repository }}
  IMAGE_MIGRATE: ghcr.io/${{ github.repository }}-migrate
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract runtime image metadata
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_RUNTIME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build & push runtime image
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          annotations: ${{ steps.meta-runtime.outputs.annotations }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Sign runtime image (keyless)
        run: |
          cosign sign --yes \
            -a owner=anekdote -a team=platform \
            -a repo=${{ github.repository }} \
            -a ref=${{ github.ref_name }} \
            ${{ env.IMAGE_RUNTIME }}@${{ steps.build-runtime.outputs.digest }}

  publish-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract migrate image metadata
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_MIGRATE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build & push migrate image
        id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          annotations: ${{ steps.meta-migrate.outputs.annotations }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Sign migrate image (keyless)
        run: |
          cosign sign --yes \
            -a owner=anekdote -a team=platform \
            -a repo=${{ github.repository }} \
            -a ref=${{ github.ref_name }} \
            ${{ env.IMAGE_MIGRATE }}@${{ steps.build-migrate.outputs.digest }}
