name: Publish Image

on:
  push:
    tags:
      - '*' # matches release.yml — fires on any tag push (e.g. v1.0.0)

permissions:
  contents: read
  id-token: write   # required for cosign keyless signing via GitHub OIDC

env:
  REGISTRY: registry.anekdote.in
  IMAGE_RUNTIME: registry.anekdote.in/anekdote/anekdote-auth
  IMAGE_MIGRATE: registry.anekdote.in/anekdote/anekdote-auth-migrate
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry.anekdote.in
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build & push runtime image
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_RUNTIME }}:${{ github.ref_name }}
            ${{ env.IMAGE_RUNTIME }}:latest

      - name: Sign runtime image (keyless)
        run: |
          cosign sign --yes \
            -a owner=anekdote -a team=platform \
            -a repo=${{ github.repository }} \
            -a ref=${{ github.ref_name }} \
            ${{ env.IMAGE_RUNTIME }}@${{ steps.build-runtime.outputs.digest }}

      - name: Build & push migrate image
        id: build-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATE }}:${{ github.ref_name }}
            ${{ env.IMAGE_MIGRATE }}:latest

      - name: Sign migrate image (keyless)
        run: |
          cosign sign --yes \
            -a owner=anekdote -a team=platform \
            -a repo=${{ github.repository }} \
            -a ref=${{ github.ref_name }} \
            ${{ env.IMAGE_MIGRATE }}@${{ steps.build-migrate.outputs.digest }}
